name: mirror verified 0.9.2 images

on:
  push:
    branches: ['release/0.9.2-mirror']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the successful image recovery at the reviewed workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/silenthooligan/localsky/' + path]))
          deadline = time.monotonic() + 45 * 60
          while True:
              result = api('actions/runs/35619459706')
              assert result['head_sha'] == '76f82e69eec47478264cb2f2e671ea414c9bb407'
              if result['status'] == 'completed':
                  assert result['conclusion'] == 'success', 'Image recovery did not pass'
                  break
              assert time.monotonic() < deadline, 'Image recovery deadline elapsed'
              time.sleep(20)
          assert api('git/ref/tags/v0.9.2')['object']['sha'] == '3582031134d4b392b5ca4896b1010b7442aa7794'
          assert api('releases/latest')['tag_name'] in {'v0.9.1', 'v0.9.2'}, 'Do not overwrite a newer release'
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror the verified manifest and confirm anonymous pulls
        env:
          MIRROR_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker buildx imagetools create \
            -t "docker.io/${MIRROR_OWNER}/localsky:0.9.2" \
            -t "docker.io/${MIRROR_OWNER}/localsky:0.9" \
            -t "docker.io/${MIRROR_OWNER}/localsky:latest" \
            ghcr.io/silenthooligan/localsky:0.9.2
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          accept = 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          repository = os.environ['MIRROR_OWNER'] + '/localsky'
          def get(url, headers=None):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers or {}), timeout=30) as response:
                  return dict(response.headers), json.load(response)
          _, token = get('https://auth.docker.io/token?' + urllib.parse.urlencode({'service': 'registry.docker.io', 'scope': 'repository:' + repository + ':pull'}))
          headers = {'Authorization': 'Bearer ' + token['token'], 'Accept': accept}
          manifests = {}
          for tag in ['0.9.2', '0.9', 'latest']:
              meta, body = get('https://registry-1.docker.io/v2/' + repository + '/manifests/' + tag, headers)
              platforms = sorted(m['platform']['architecture'] for m in body['manifests'] if m.get('platform', {}).get('os') == 'linux')
              assert platforms == ['amd64', 'arm64'], platforms
              manifests[tag] = {'digest': next(v for k, v in meta.items() if k.lower() == 'docker-content-digest'), 'platforms': platforms}
          assert len({m['digest'] for m in manifests.values()}) == 1
          pathlib.Path('mirror-proof.json').write_text(json.dumps({'result': 'pass', 'repository': repository, 'manifests': manifests}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dockerhub-mirror-proof
          path: mirror-proof.json
