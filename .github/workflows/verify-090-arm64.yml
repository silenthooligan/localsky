name: verify 0.9.0 ARM64

# Recovery for hosted runners stopped while compiling the full debug build.
# The immutable release source and every test stay unchanged. Serial compilation
# and omitting debug symbols bound compiler memory without disabling assertions.
on:
  push:
    branches: ['release/0.9.0-ci-recovery']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full ARM64 tests at immutable v0.9.0
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1dcfd67483b1e1cae07d46562c36ac854dcfbbe
      - name: Verify immutable release source
        run: |
          test "$(git rev-parse HEAD)" = d1dcfd67483b1e1cae07d46562c36ac854dcfbbe
          test "$(git rev-parse HEAD^{tree})" = 4f7c909aa3e00835804c4194e05be753ce2aacbc
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Run the complete release test suite
        run: cargo test --locked --no-default-features --features ssr --tests -j 1
