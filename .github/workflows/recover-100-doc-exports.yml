# Exact 1.0.0 application source; repair only two generated text exports.
# All source, guide, native image, startup and security checks remain required.
name: Recover 1.0.0 generated guide exports
'on':
  push:
    branches:
    - release/1.0.0-doc-export-recovery
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  checks-release-tools:
    name: release tooling tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: v1.0.0
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Verify immutable source and regenerate only guide exports
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = f79ff54d3baed26ed18b8ee825d9fa0361bb25d3
        test "$(git rev-parse 'HEAD^{tree}')" = fb43590ec5ea1419c53082d11604a155e80d80c3
        test "$(git rev-parse 'v1.0.0^{commit}')" = f79ff54d3baed26ed18b8ee825d9fa0361bb25d3
        test -z "$(git status --porcelain)"
        python3 .github/scripts/build-doc-assets.py
        python3 .github/scripts/build-doc-assets.py --check
        python3 - <<'PY'
        import hashlib, json, pathlib, subprocess
        changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
        assert changed == {'docs/src/llms.txt', 'docs/src/llms-full.txt'}, changed
        proof = {'source': 'f79ff54d3baed26ed18b8ee825d9fa0361bb25d3', 'tree': 'fb43590ec5ea1419c53082d11604a155e80d80c3', 'version': '1.0.0',
                 'application_source_unchanged': True, 'generated_docs': {}}
        for name in sorted(changed):
            proof['generated_docs'][name] = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
        pathlib.Path('source-recovery.json').write_text(json.dumps(proof, indent=2))
        PY
    - run: |-
        export GITHUB_SHA=f79ff54d3baed26ed18b8ee825d9fa0361bb25d3
        export GITHUB_REF=refs/tags/v1.0.0
        python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: immutable-source-recovery
        path: source-recovery.json
        if-no-files-found: error
  checks-fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
