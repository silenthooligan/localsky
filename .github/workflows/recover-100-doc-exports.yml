        pathlib.Path('source-recovery.json').write_text(json.dumps(proof, indent=2))
        PY
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        components: rustfmt, clippy
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
    - name: cargo fmt
      run: |-
        export GITHUB_SHA=f79ff54d3baed26ed18b8ee825d9fa0361bb25d3
        export GITHUB_REF=refs/tags/v1.0.0
        cargo fmt --all -- --check
    - name: cargo clippy
      run: |-
        export GITHUB_SHA=f79ff54d3baed26ed18b8ee825d9fa0361bb25d3
        export GITHUB_REF=refs/tags/v1.0.0
        cargo clippy --no-default-features --features ssr --all-targets -- -D warnings
