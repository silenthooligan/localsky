name: docker

# PRs exercise both native builds, startup and scans without publishing.
# Only the release workflow promotes images, after its source checks pass.
on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build + verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-tools
        with:
          dockerfile: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build native image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .ci-Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: GIT_SHA=${{ github.sha }}
          # Release candidates are pushed only by digest, preserving BuildKit
          # provenance. No version/Latest tags exist until native checks pass.
          # PRs and rehearsals load locally and never write to the registry.
          load: ${{ !inputs.publish }}
          tags: ${{ !inputs.publish && format('localsky-verify:{0}', github.sha) || '' }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || '' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Native startup, health and assets
        env:
          SMOKE_IMAGE: ${{ inputs.publish && format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) || format('localsky-verify:{0}', github.sha) }}
        run: python3 .github/scripts/smoke-image.py
      - name: Scan this native image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ inputs.publish && format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) || format('localsky-verify:{0}', github.sha) }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Check scan architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open('trivy.json'))
          assert report['Metadata']['ImageConfig']['architecture'] == os.environ['EXPECTED_ARCH']
          PY
      - name: Record verified image digest
        if: inputs.publish
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest), digest
          pathlib.Path('digests').mkdir()
          proof = {'source': os.environ['GITHUB_SHA'], 'architecture': os.environ['ARCH'], 'digest': digest}
          pathlib.Path('digests', os.environ['ARCH'] + '.json').write_text(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.publish
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-checks-${{ matrix.arch }}
          path: |
            build-tools-proof.json
            runtime-proof.json
            trivy.json
          retention-days: 30
          overwrite: true

  promote:
    name: Promote verified images
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote GHCR and configured Docker Hub mirror
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/release.py promote
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: release-images.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
