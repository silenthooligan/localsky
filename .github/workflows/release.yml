name: release

# One run owns validation, source checks, both native images and publication.
# Rerun failed jobs to resume this exact tag. Never move a published version tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run the entire pipeline without publishing images or a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize promotions across versions so an older run cannot overwrite Latest.
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.validate.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate immutable version and publication state
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          args=()
          if [ "$VERIFY_ONLY" = true ]; then args+=(--verify-only); fi
          python3 .github/scripts/release.py validate "${args[@]}"

  checks:
    needs: validate
    if: needs.validate.outputs.published != 'true'
    uses: ./.github/workflows/ci.yml

  images:
    needs: [validate, checks]
    if: needs.validate.outputs.published != 'true'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ !inputs.verify_only }}
    secrets: inherit

  publish:
    needs: [validate, checks, images]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.validate.outputs.published == 'true' ||
       (needs.checks.result == 'success' && needs.images.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish once, preserving existing releases on retries
        if: '!inputs.verify_only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
      - name: Record successful rehearsal
        if: inputs.verify_only
        run: echo 'Source checks, both native images, startup and scans passed. No images or release were published.' >> "$GITHUB_STEP_SUMMARY"
