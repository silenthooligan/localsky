# macOS 14 was retired after this tag was prepared. All checks and image
# builds use the unchanged public 1.1.0 commit. Only the runner changes.
name: Recover immutable 1.1.0 release
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RELEASE_SHA: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.validate.outputs.published }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - name: Validate immutable version and publication state
      id: validate
      env:
        GH_TOKEN: ${{ github.token }}
      run: GITHUB_REF=refs/tags/v1.1.0 GITHUB_SHA="$RELEASE_SHA" python3 .github/scripts/release.py validate
  check-release-tools:
    name: release tooling tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  check-fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.97.1
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
    - name: cargo fmt
      run: cargo fmt --all -- --check
    - name: cargo clippy
      run: cargo clippy --no-default-features --features ssr --all-targets -- -D warnings
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  check-test:
    name: test
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        - ubuntu-24.04-arm
        - macos-15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
    - name: cargo test
      run: cargo test --locked --no-default-features --features ssr --tests -j 1
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  check-build-wasm:
    name: cargo leptos build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: ./.github/actions/build-tools
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.97.1
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
    - name: install cargo-leptos
      run: |
        version=$(python3 -c 'import json; print(json.load(open(".github/build-tools.json"))["cargo_leptos"])')
        cargo install --locked cargo-leptos --version "=$version"
    - name: build
      run: cargo leptos build --release
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  check-markdown-lint:
    name: markdownlint (no em dashes)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - name: detect em dashes in user-facing prose
      run: |
        if grep -nP '[\x{2014}\x{2013}]' README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md CODE_OF_CONDUCT.md 2>/dev/null; then
          echo "Em or en dash detected; replace with commas, periods, or parens."
          exit 1
        fi
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  check-cargo-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.97.1
    - name: install cargo-audit (prebuilt)
      uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
    - run: cargo binstall --no-confirm cargo-audit
    - name: cargo audit
      run: sh scripts/audit-dependencies.sh
    needs:
    - validate
    if: needs.validate.outputs.published != 'true'
  build:
    name: build + verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
        fetch-depth: 0
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: ./.github/actions/build-tools
      with:
        dockerfile: 'true'
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build native image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: .ci-Dockerfile
        platforms: linux/${{ matrix.arch }}
        build-args: GIT_SHA=${{ env.RELEASE_SHA }}
        load: false
        tags: ''
        outputs: ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
    - name: Native startup, health and assets
      env:
        SMOKE_IMAGE: ${{ format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) }}
      run: GITHUB_REF=refs/tags/v1.1.0 GITHUB_SHA="$RELEASE_SHA" python3 .github/scripts/smoke-image.py
    - name: Scan this native image before publishing
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      env:
        TRIVY_USERNAME: ${{ github.actor }}
        TRIVY_PASSWORD: ${{ github.token }}
        TRIVY_PLATFORM: linux/${{ matrix.arch }}
      with:
        image-ref: ${{ format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) }}
        format: json
        output: trivy.json
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
    - name: Check scan architecture
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: |
        python3 - <<'PY'
        import json, os
        report = json.load(open('trivy.json'))
        assert report['Metadata']['ImageConfig']['architecture'] == os.environ['EXPECTED_ARCH']
        PY
    - name: Record verified image digest
      env:
        ARCH: ${{ matrix.arch }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        python3 - <<'PY'
        import json, os, pathlib, re
        digest = os.environ['IMAGE_DIGEST']
        assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest), digest
        pathlib.Path('digests').mkdir()
        proof = {'source': os.environ['RELEASE_SHA'], 'architecture': os.environ['ARCH'], 'digest': digest}
        pathlib.Path('digests', os.environ['ARCH'] + '.json').write_text(json.dumps(proof))
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: digests-${{ matrix.arch }}
        path: digests/*.json
        if-no-files-found: error
        retention-days: 30
        overwrite: true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: image-checks-${{ matrix.arch }}
        path: |
          build-tools-proof.json
          runtime-proof.json
          trivy.json
        retention-days: 30
        overwrite: true
    needs:
    - validate
    - check-release-tools
    - check-fmt-clippy
    - check-test
    - check-build-wasm
    - check-markdown-lint
    - check-cargo-audit
    if: needs.validate.outputs.published != 'true'
  promote:
    name: Promote verified images
    if: needs.validate.outputs.published != 'true'
    needs:
    - validate
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Promote GHCR and configured Docker Hub mirror
      env:
        GH_TOKEN: ${{ github.token }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: GITHUB_REF=refs/tags/v1.1.0 GITHUB_SHA="$RELEASE_SHA" python3 .github/scripts/release.py promote
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-images
        path: release-images.json
        if-no-files-found: error
        retention-days: 30
        overwrite: true
  publish:
    needs:
    - validate
    - check-release-tools
    - check-fmt-clippy
    - check-test
    - check-build-wasm
    - check-markdown-lint
    - check-cargo-audit
    - build
    - promote
    if: always() && needs.validate.result == 'success' && (needs.validate.outputs.published == 'true' || (needs['check-release-tools'].result
      == 'success' && needs['check-fmt-clippy'].result == 'success' && needs['check-test'].result == 'success' && needs['check-build-wasm'].result
      == 'success' && needs['check-markdown-lint'].result == 'success' && needs['check-cargo-audit'].result == 'success' && needs['build'].result
      == 'success' && needs['promote'].result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 2c88b03a0d7e35ddfc7a6ffcc5a83e499369008e
    - name: Verify immutable 1.1.0 source
      run: |
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse refs/tags/v1.1.0^{commit})" = "$RELEASE_SHA"
    - name: Publish once, preserving existing releases on retries
      env:
        GH_TOKEN: ${{ github.token }}
      run: GITHUB_REF=refs/tags/v1.1.0 GITHUB_SHA="$RELEASE_SHA" python3 .github/scripts/release.py publish
