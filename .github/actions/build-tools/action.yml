name: Verified Leptos tools
description: Prepare native, checksum-pinned tools before compilation
inputs:
  dockerfile:
    description: Generate a Dockerfile with the verified tools installed
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/localsky-build-tools
        key: leptos-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/build-tools.json') }}
    - name: Download, verify and install build tools
      shell: bash
      env:
        PREPARE_DOCKERFILE: ${{ inputs.dockerfile }}
      run: |
        args=()
        if [ "$PREPARE_DOCKERFILE" = true ]; then args+=(--dockerfile); fi
        python3 .github/scripts/prepare-build-tools.py "${args[@]}"
